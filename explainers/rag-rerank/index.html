.x-head{display:flex;flex-direction:column;gap:4px}
.x-eyebrow{font:700 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.x-head h1{font:800 clamp(24px,4vw,34px)/1.15 var(--display);margin:0;text-wrap:balance}
.x-sub{margin:0;color:var(--muted);max-width:65ch}

/* stage */
.x-stage-wrap{position:relative;width:100%;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}

.x-el.is-hidden{pointer-events:none}
.x-stage.no-anim .x-el,.x-stage.no-anim .x-el *{transition:none!important;animation:none!important}

.x-input{display:flex;align-items:center;gap:12px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);font:600 16px var(--display);white-space:nowrap;overflow:hidden}
.x-input .tag{font:700 12px var(--mono);color:var(--panel);background:var(--fg);border-radius:6px;padding:3px 8px}
.x-input .hint{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}
.x-label{font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.x-chips{display:flex;gap:12px}
.x-chip{font:700 12px var(--mono);padding:6px 10px;border-radius:999px;border:1.5px solid var(--line);white-space:nowrap}
.x-chip.tone-teal{color:var(--teal);border-color:var(--teal)}
.x-chip.tone-blue{color:var(--blue);border-color:var(--blue);background:var(--blue-soft)}
.x-chip.tone-gold{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
.x-alert{text-align:center;font:700 12px var(--mono);color:#fff;background:var(--bad);border-radius:8px;padding:6px}
.x-box{border:2px solid var(--fg);border-radius:14px;background:var(--panel)}
.x-box h3{margin:0;padding:12px 14px 0;font:800 18px var(--display)}

.x-meter .bar{height:10px;border-radius:5px;background:var(--dot);overflow:hidden}
.x-meter .fill{height:100%;width:0;border-radius:5px;background:var(--ok);transition:width 1.1s ease,background-color .4s}
.x-meter.tone-bad .fill{background:var(--bad)}

.x-bubble{padding:10px 12px;border-radius:10px;font:600 13px/1.4 var(--display);border:1.5px solid var(--line);background:var(--panel)}

.x-summary .lead{width:100%;text-align:center;font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.x-summary .tag2{font:600 13px var(--display);padding:6px 12px;border-radius:999px;border:1.5px solid var(--line)}
.x-summary .take{font:800 34px/1.1 var(--display);text-align:center}

.x-panel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}

.x-wrap button.primary{background:var(--fg);color:var(--panel);border-color:var(--fg);min-width:84px}
.x-scenes{display:flex;flex-wrap:wrap;gap:6px}

@media (prefers-reduced-motion:reduce){.x-el,.x-meter .fill,.x-summary .fx{transition-duration:.01s!important}.x-scan.on,.x-box.shake{animation:none}}
